<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" font-family="'Playfair Display', Georgia, serif">
  <!-- ===== BANDEAU DE SIGNATURE ÉDITORIALE — « Les Éditions ÉLAN » =====
       À apposer sur chaque publication (sous le logo, au-dessus du titre).
       Variante : couleur logo selon le thème produit (ici ambre/slate). -->

  <!-- Logo officiel (version courte, ramure) -->
  <g stroke="#FBBF24" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="260" y1="70" x2="260" y2="38"/>
    <path d="M260 54 L238 30"/>
    <path d="M260 54 L282 30"/>
    <path d="M260 38 L260 20"/>
  </g>
  <g fill="#FBBF24">
    <circle cx="238" cy="28" r="3.5"/>
    <circle cx="282" cy="28" r="3.5"/>
    <circle cx="260" cy="18" r="4"/>
  </g>

  <!-- ÉLAN -->
  <text x="260" y="105" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="6" fill="#F8FAFC">ÉLAN</text>

  <!-- LES ÉDITIONS ÉLAN -->
  <text x="260" y="138" text-anchor="middle" font-size="15" font-weight="500" letter-spacing="7" fill="#FBBF24">LES ÉDITIONS ÉLAN</text>

  <!-- Séparateur -->
  <line x1="180" y1="154" x2="340" y2="154" stroke="#FBBF24" stroke-width="1" opacity="0.5"/>

  <!-- Titre de la publication (à remplacer) -->
  <text x="260" y="182" text-anchor="middle" font-size="20" font-style="italic" fill="#F8FAFC">Titre de la publication</text>
</svg>