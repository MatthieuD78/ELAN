<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" font-family="'Playfair Display', Georgia, serif">
  <defs>
    <linearGradient id="gA" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.6" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.6" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Fond du badge -->
  <rect x="60" y="60" width="360" height="360" rx="80" fill="#0f172a"/>

  <!-- La tête du wapiti (profil gauche) : silhouette majestueuse -->
  <!-- Museau + tête, style épuré/totémique -->
  <g fill="none" stroke="url(#grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- profil : front, museau, mâchoire, base cou -->
    <path d="M120 268 C120 240 140 224 168 218 C186 214 200 202 206 184"/>
    <path d="M206 184 C210 196 224 210 244 214 C266 218 288 212 300 196"/>
    <path d="M300 196 C286 220 256 238 224 238 C200 238 180 248 168 268"/>
    <!-- oreille -->
    <path d="M244 210 C252 194 260 192 264 200"/>
  </g>

  <!-- LES BOIS = FLÈCHES ASCENDANTES (le mouvement + la transformation) -->
  <!-- Bois gauche (principal) -->
  <path d="M150 232 L150 180 L170 180 L170 168 L150 168 L150 156 L170 156" fill="none" stroke="url(#gA)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M192 210 L192 160 L212 160 L212 146 L192 146 L212 146" fill="none" stroke="url(#gA)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bois droit -->
  <path d="M268 196 L268 152 L288 152 L288 138 L268 138 L288 138" fill="none" stroke="url(#gA)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 210 L230 176 L250 176 L250 162 L230 162 L250 162" fill="none" stroke="url(#gA)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nom ÉLAN -->
  <text x="240" y="352" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="6" fill="#F8FAFC">ÉLAN</text>
  <!-- Sous-titre -->
  <text x="240" y="398" text-anchor="middle" font-size="20" letter-spacing="10" fill="#FBBF24" opacity="0.9">LA TRANSFORMATION</text>
</svg>