<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" font-family="'Playfair Display', Georgia, serif">
  <defs>
    <linearGradient id="trunkGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Fond du badge -->
  <rect x="50" y="50" width="540" height="540" rx="120" fill="#0f172a"/>

  <!-- ============ EMBLÈME : tronc central = "soi", ramification en bois/flèches ============= -->
  <!-- Trone + ramure, symétrique, forme de blason -->
  <g stroke="url(#trunkGrad)" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tronc central (le soi) -->
    <line x1="320" y1="470" x2="320" y2="330" stroke-width="20"/>
    <!-- Base du tronc legèrement évasée -->
    <path d="M300 470 C305 450 315 440 320 330"/>

    <!-- Ramure gauche (bois-flèche) -->
    <path d="M320 360 C300 340 268 320 232 292"/>     <!-- branche montante -->
    <path d="M232 292 C236 268 242 252 244 230"/>      <!-- crosse gauche externe -->
    <path d="M268 320 C262 300 258 282 256 260"/>      <!-- pousse vers haut-gauche -->
    <path d="M320 300 C296 290 282 282 270 268"/>      <!-- ramification inférieure -->
    <path d="M256 260 L236 244"/>                       <!-- pointe flèche haut -->
  </g>

  <!-- Pointes-bourgeons : petites pastilles émeraude = croissance -->
  <g fill="#10B981">
    <circle cx="244" cy="228" r="9"/>
    <circle cx="256" cy="258" r="7"/>
  </g>
  <g fill="#FBBF24">
    <circle cx="320" cy="188" r="12"/>  <!-- sommet = plus haute pousse, symbole d'accomplissement -->
    <circle cx="386" cy="228" r="9"/>
    <circle cx="384" cy="258" r="7"/>
  </g>

  <!-- ============ Nom ============= -->
  <text x="320" y="532" text-anchor="middle" font-size="92" font-weight="700" letter-spacing="10" fill="#F8FAFC">ÉLAN</text>
  <text x="320" y="580" text-anchor="middle" font-size="22" letter-spacing="12" fill="#FBBF24" opacity="0.92">LA TRANSFORMATION</text>
  <text x="320" y="610" text-anchor="middle" font-size="15" letter-spacing="8" fill="#94A3B8" opacity="0.8">Accompagnée</text>
</svg>